name: Homebrew

# Updates the formula in the tap after a release. release.yml calls this; it can also be run by
# hand to republish the formula of an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
    secrets:
      TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The checksums come from the release itself, with the workflow token, so this also works
      # while the repository is private.
      - name: Fetch the release checksums
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir checksums

      - name: Update the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -eu
          key="$RUNNER_TEMP/tap_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:JoyoMDEV/homebrew-tap.git tap
          mkdir -p tap/Formula
          CHECKSUM_DIR=checksums scripts/formula.sh "$TAG" > tap/Formula/sessions.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sessions.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "sessions ${TAG#v}"
          git push origin HEAD:main
