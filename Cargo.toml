[package]
name = "sessions"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI to browse and resume saved Claude Code sessions"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude-code", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
fuzzy-matcher = "0.3.7"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
