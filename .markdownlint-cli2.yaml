# Run with: sh scripts/check.sh lint   (it pins the version of markdownlint-cli2 and runs the other lint checks too)
config:
  default: true
  # Line length: the README and the docs keep a paragraph on one line, and tables are long.
  MD013: false
globs:
  - "README.md"
  - "AGENTS.md"
  - "docs/**/*.md"
  - ".claude/skills/**/*.md"
